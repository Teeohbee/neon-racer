# fly.toml app configuration file generated for neon-racer on 2026-11-11T11:26:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'neon-racer'
primary_region = 'lhr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
